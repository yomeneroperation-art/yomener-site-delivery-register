name: Deploy Yomener Register to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax before deployment
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [];
          let rest = html;
          while ((rest = rest.slice(rest.indexOf('<script') + 7)) && rest.length) {
            const open = rest.indexOf('>');
            if (open < 0) break;
            const close = rest.indexOf('</script>', open + 1);
            if (close < 0) break;
            const body = rest.slice(open + 1, close);
            if (body.trim()) scripts.push(body);
            rest = rest.slice(close + 9);
          }
          if (!scripts.length) throw new Error('No inline scripts found for syntax validation');
          scripts.forEach((script, i) => {
            try { new Function(script); console.log('Inline script ' + (i + 1) + ': syntax OK'); }
            catch (error) { console.error('Inline script ' + (i + 1) + ': ' + error.stack); process.exitCode = 1; }
          });
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Remove stale Pages artifacts from previous attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              name: 'github-pages'
            });
            for (const artifact of data.artifacts) {
              core.info(`Deleting stale Pages artifact ${artifact.id} before upload`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
